name: App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install mpv dylibbundler
      - name: Test
        run: swift test
      - name: Version
        run: |
          echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Signing identity
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -n "$DEVELOPER_ID_P12" ]; then P12=$DEVELOPER_ID_P12; P12_PASSWORD=$DEVELOPER_ID_PASSWORD; fi
          if [ -z "$P12" ]; then echo "No signing identity; signing ad hoc."; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KP=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          ID=$(security find-identity -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          if [ -n "$DEVELOPER_ID_P12" ] && [ -z "$ID" ]; then
            echo "::error::DEVELOPER_ID_P12 holds no 'Developer ID Application' identity (certificate plus private key)."
            security find-identity -p codesigning "$KC" | sed -n 's/.*"\(.*\)".*/  found: \1/p'
            exit 1
          fi
          echo "SIGN_IDENTITY=${ID:-Ciniva Code Signing}" >> "$GITHUB_ENV"
      - name: Build
        run: BUNDLE_LIBS=1 ./build.sh
      - name: Notarize
        if: startsWith(env.SIGN_IDENTITY, 'Developer ID Application:')
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ditto -c -k --keepParent build/Ciniva.app "$RUNNER_TEMP/notarize.zip"
          auth=(--apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID")
          id=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" --output-format json | jq -r .id)
          echo "Submission $id"
          xcrun notarytool wait "$id" "${auth[@]}" --timeout 20m || true
          status=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | jq -r .status)
          case "$status" in
            Accepted)
              xcrun stapler staple build/Ciniva.app
              spctl --assess --type execute --verbose=2 build/Ciniva.app ;;
            "In Progress")
              # Apple can hold a new team's submissions for a day; the ticket is still issued later and Gatekeeper finds it online.
              echo "::warning::Notarization $id still in progress; releasing without a stapled ticket." ;;
            *)
              xcrun notarytool log "$id" "${auth[@]}" || true
              echo "::error::Notarization $id: $status"; exit 1 ;;
          esac
      - name: Package
        run: ditto -c -k --keepParent build/Ciniva.app "Ciniva-$VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Ciniva-${{ env.VERSION }}
          path: Ciniva-${{ env.VERSION }}.zip
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION is already released."; exit 0; fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "UPDATE_SIGNING_KEY is not set; not releasing." >&2; exit 1; fi
          swift scripts/sign-update.swift "Ciniva-$VERSION.zip" > "Ciniva-$VERSION.zip.sig"
          gh release create "v$VERSION" "Ciniva-$VERSION.zip" "Ciniva-$VERSION.zip.sig" \
            --title "Ciniva $VERSION" --generate-notes --target "$GITHUB_SHA"
